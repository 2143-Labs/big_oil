[package]
name = "big_oil"
version = "0.1.0"
edition = "2024"
description = "Path of Exile public stash market stream listener and item index"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flate2 = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
# In-game overlay: layer-shell (overlay layer renders above fullscreen windows).
smithay-client-toolkit = { version = "0.21.1", default-features = false }

[profile.release]
lto = "thin"
